{% extends "base.html" %}

{% block title %}Download Progress — Genki{% endblock %}

{% block content %}
<div class="card">
    <h2>⏳ Download Progress</h2>

    <div class="progress-wrap">
        <div id="progressBar" class="progress-bar" style="width:0%"></div>
    </div>

    <p id="message">Starting…</p>
    <p id="count"></p>

    <div class="actions">
        <button id="stopBtn" class="danger" onclick="stopJob()">Stop</button>
        <a id="downloadBtn" href="/download" style="display:none;">
            <button class="primary">Download ZIP</button>
        </a>
    </div>
</div>

<!-- small ad slot on status page -->
<div class="ad-slot ad-slot-inline">
    <ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-REPLACE"
        data-ad-slot="REPLACE"></ins>
</div>

<script>
    async function poll() {
        try {
            const res = await fetch("/progress");
            const data = await res.json();

            document.getElementById("message").innerText = data.message || '';
            document.getElementById("count").innerText = data.downloaded ? `Images: ${data.downloaded}` : '';

            // rough progress percent
            const percent = Math.min(100, Math.round((data.downloaded || 0) / 2));
            document.getElementById('progressBar').style.width = percent + '%';

            if (data.status === "done") {
                document.getElementById("downloadBtn").style.display = "inline-block";
                document.getElementById("stopBtn").style.display = "none";
            } else if (data.status !== "stopped" && data.status !== "error") {
                setTimeout(poll, 1500);
            }
        } catch (e) {
            document.getElementById("message").innerText = 'Error fetching progress';
        }
    }

    async function stopJob() {
        try {
            // provide immediate feedback to user
            const stopBtn = document.getElementById("stopBtn");
            stopBtn.disabled = true;
            document.getElementById("message").innerText = 'Stopping...';

            const res = await fetch("/stop", { method: "POST" });
            const json = await res.json().catch(() => ({}));

            if (json && json.stopped) {
                stopBtn.style.display = 'none';
                // poll once shortly to update status
                setTimeout(poll, 500);
            } else {
                document.getElementById("message").innerText = 'Stop request failed';
                stopBtn.disabled = false;
            }
        } catch (e) {
            document.getElementById("message").innerText = 'Stop request failed';
            try { document.getElementById("stopBtn").disabled = false; } catch (e) {}
        }
    }

    poll();
</script>
{% endblock %}
