<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Genki Image Downloader – Download Images from a Website{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Genki lets designers, developers, and researchers download images from a website into a ZIP for publicly accessible pages, respecting creator rights and site rules.">
    <meta name="robots" content="index,follow">
    <!-- Replace with your Google Search Console verification token -->
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_TOKEN">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/static/manifest.json">

        <!-- Google Analytics 4 (placeholder ID) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);} 
            gtag('js', new Date());
            gtag('config', 'G-XXXXXXXXXX');
        </script>

    <!-- Clean UI fonts (Inter + Noto Sans JP for Japanese glyphs) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Google AdSense: add your client ID into the script below when ready -->
    <!--Example (replace ca-pub-XXXXXXXX):-->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1328727126151207"
        crossorigin="anonymous"></script>


    <link rel="stylesheet" href="/static/style.css">
    <link rel="canonical" href="{{ request.url_root }}">
    <meta property="og:site_name" content="Genki Image Downloader">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Genki — Fast Image Downloader">
    <meta property="og:description" content="Fast, safe image downloader with beautiful anime-inspired UI">
    <meta property="og:image" content="{{ url_for('static', filename='anime-illustration.svg') }}">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Genki Image Downloader",
            "url": "{{ request.url_root }}",
            "potentialAction": {
                "@type": "SearchAction",
                "target": "{{ request.url_root }}?q={search_term_string}",
                "query-input": "required name=search_term_string"
            }
        }
        </script>
</head>

<body class="theme-instagram">
    <header class="site-header">
        <a class="logo" href="/">
            <img src="/static/logo.svg" alt="Genki" />
            <span>Genki</span>
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- AdSense / Consent placeholder -->
    <div id="cookie-consent" class="cookie-consent" aria-live="polite" style="display:none">
        <div class="consent-inner">
            <p>We display ads to support this site. Do you consent to personalized ads?</p>
            <div class="consent-actions">
                <button id="consentAccept" class="primary">Accept</button>
                <button id="consentDecline" class="danger">Decline</button>
            </div>
        </div>
    </div>

    <script>
        // The server may provide an AdSense client id via `adsense_client` context variable
        window.ADSENSE_CLIENT = "{{ adsense_client or '' }}";

        function setTheme(name) { document.body.className = name; }

        // Consent management for ads
        (function () {
            const banner = document.getElementById('cookie-consent');
            const accepted = localStorage.getItem('genki_ads_consent');
            function loadAds() {
                const CLIENT = (window.ADSENSE_CLIENT || '').trim();
                if (!CLIENT || CLIENT.indexOf('REPLACE') === 0) return;
                if (window.adsbygoogleLoaded) return;
                const s = document.createElement('script');
                s.async = true;
                s.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${CLIENT}`;
                s.crossOrigin = 'anonymous';
                s.onload = function () {
                    // initialize any placeholder ad slots on the page
                    const slots = document.querySelectorAll('ins.adsbygoogle');
                    slots.forEach(() => {
                        try {
                            (adsbygoogle = window.adsbygoogle || []).push({});
                        } catch (e) { console.warn('ad push failed', e); }
                    });
                };
                document.head.appendChild(s);
                window.adsbygoogleLoaded = true;
            }

            if (accepted === 'true') { loadAds(); }
            else if (accepted === null) { banner.style.display = 'block'; }

            document.getElementById('consentAccept').addEventListener('click', function () {
                localStorage.setItem('genki_ads_consent', 'true');
                banner.style.display = 'none';
                loadAds();
            });
            document.getElementById('consentDecline').addEventListener('click', function () {
                localStorage.setItem('genki_ads_consent', 'false');
                banner.style.display = 'none';
            });
        })();
    </script>
</body>

</html>
