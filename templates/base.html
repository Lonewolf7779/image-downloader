<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Genki Image Downloader – Download Images from a Website{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Genki lets designers, developers, and researchers download images from a website into a ZIP for publicly accessible pages, respecting creator rights and site rules.">
    <meta name="robots" content="index,follow">
    <!-- Replace with your Google Search Console verification token -->
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_TOKEN">

    <!-- Web App Manifest -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Google Analytics 4 (placeholder ID) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
    </script>

    <!-- Clean UI fonts (Inter + Noto Sans JP for Japanese glyphs) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap"
        rel="stylesheet">

    <!-- Google AdSense: add your client ID into the script below when ready -->
    <!-- AdSense script removed from template pages to ensure ads only appear on the static landing page -->


    <link rel="stylesheet" href="/static/style.css">
    <link rel="canonical" href="{{ request.url_root }}">
    <meta property="og:site_name" content="Genki Image Downloader">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Genki — Fast Image Downloader">
    <meta property="og:description" content="Fast, safe image downloader with beautiful anime-inspired UI">
    <meta property="og:image" content="{{ url_for('static', filename='anime-illustration.svg') }}">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "Genki Image Downloader",
            "url": "{{ request.url_root }}",
            "potentialAction": {
                "@type": "SearchAction",
                "target": "{{ request.url_root }}?q={search_term_string}",
                "query-input": "required name=search_term_string"
            }
        }
        </script>
</head>

<body class="theme-instagram">
    <header class="site-header">
        <a class="logo" href="/app">
            <img src="/static/logo.svg" alt="Genki" />
            <span>Genki</span>
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- AdSense and consent removed from templated pages to prevent ads on tool screens -->
</body>

</html>
