{% extends "base.html" %}

{% block title %}Genki — Fast Image Downloader{% endblock %}

{% block content %}
<div class="card">
    <div class="hero">
        <img src="/static/anime-girl.svg" alt="anime girl" class="hero-illustration">
    </div>

    <h1>Genki Image Downloader</h1>
    <p class="tagline">Fast · Cute · Professional ✨</p>

    <form method="POST">
        <input name="url" placeholder="Paste website URL…" required>
        <button type="submit" class="primary">Start Download</button>
    </form>

    <!-- Ad slot placeholder: will load after consent (responsive) -->
    <div class="ad-slot ad-slot-responsive">
        <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-REPLACE" data-ad-slot="REPLACE"
            data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>

    <p class="note">Max 200 images · ZIP output · Respect copyrights</p>

    <footer>
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="/contact">Contact</a>
    </footer>
</div>
{% endblock %}
